name: Release & Cloud Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Hardware Vault Gatekeeper
        shell: pwsh
        run: |
          if (Test-Path "./scripts/check_vault_leaks.ps1") {
              Write-Host "[*] Running Vault Leak Gatekeeper..." -ForegroundColor Cyan
              & ./scripts/check_vault_leaks.ps1
          } else {
              Write-Host "[*] Vault leak script not present in repository checkout, skipping check." -ForegroundColor Yellow
          }

      - name: Build Standalone Executable
        run: pnpm tauri build --no-bundle

      - name: Build NSIS Installer
        run: pnpm tauri build --bundles nsis

      # ------------------------------------------------------------------------
      # [Open Source Code Signing Hook - Reserved for SignPath / Trusted Signing]
      # When approved for free open source signing, insert the signing action here:
      # - name: Sign Executable & Installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     ...
      # ------------------------------------------------------------------------

      - name: Prepare Artifacts & Calculate Hashes
        id: prepare_artifacts
        shell: pwsh
        run: |
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$ver-dev" }
          Write-Host "Target Version: $ver | Tag: $tag" -ForegroundColor Green

          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 1. Standalone Exe
          $srcExe = "src-tauri/target/release/open-revo.exe"
          $destExe = "$distDir/open-revo.exe"
          Copy-Item -LiteralPath $srcExe -Destination $destExe -Force

          # 2. Portable 7z Archive
          $portableName = "OpenRevo-${tag}-portable.7z"
          $dest7z = "$distDir/$portableName"
          & 7z a -t7z -mx=9 "$dest7z" "$destExe"

          # 3. NSIS Installer
          $nsisSourceDir = "src-tauri/target/release/bundle/nsis"
          $matchedNsis = Get-ChildItem -Path $nsisSourceDir -Filter "*.exe" | Select-Object -First 1
          if ($matchedNsis) {
              $installerName = "OpenRevo-${tag}-x64-Setup.exe"
              $destInstaller = "$distDir/$installerName"
              Copy-Item -LiteralPath $matchedNsis.FullName -Destination $destInstaller -Force
              Write-Host "Found NSIS Installer: $installerName" -ForegroundColor Cyan
          }

          # 4. Generate SHA256 Checksums
          $checksumFile = "$distDir/checksums.txt"
          Get-ChildItem -Path $distDir -Filter "*.*" | Where-Object { $_.Name -ne "checksums.txt" } | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
          }

          Write-Host "=== Artifacts Prepared ===" -ForegroundColor Green
          Get-Content $checksumFile

          # Set output for subsequent steps
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifacts (Workflow Storage)
        uses: actions/upload-artifact@v4
        with:
          name: open-revo-artifacts-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: dist_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release (Tag / Dispatch)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.draft == 'true'
        with:
          name: OpenRevo ${{ steps.prepare_artifacts.outputs.tag_name }}
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: dist_artifacts/*
          generate_release_notes: true
